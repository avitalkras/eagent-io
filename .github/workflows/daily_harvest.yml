# Eagent.io daily harvest — Phase 7, PR #9.
#
# Runs the whole live pipeline once a day, unattended: scrape -> load ->
# score unscored postings -> notify on high matches. See
# docs/08-going-live-secrets-and-migrations.md for the full secrets
# reference and the Neon migration commands this depends on having been
# run once, by hand, against the production database before this workflow
# is enabled.
#
# WHY EVERY STEP AFTER SETUP RUNS WITH `if: always()`:
#   Ingestion (scraping) and scoring are independent phases operating on
#   different parts of the pipeline — score_unscored_jobs.py works off
#   whatever's already in dim_jobs regardless of whether *this run's*
#   ingestion step succeeded. A hiccup in one phase (a flaky scrape) should
#   not prevent the next phase (scoring last run's backlog) from still
#   making progress, and a partial scoring failure (score_unscored_jobs.py
#   exits 1 if ANY job failed, even if most succeeded — see that script's
#   docstring) shouldn't suppress notifying about the ones that DID score
#   well. `if: always()` on later steps preserves that resilience. The JOB's
#   overall status still reports failure if any step failed — you still get
#   the visible red X (and GitHub's free failure email) when something
#   needs attention; later steps just get their own independent chance to
#   make progress regardless.
#
# WHY THIS ISN'T FOLDED INTO ci.yml:
#   ci.yml validates every push/PR against an ephemeral, empty-then-
#   destroyed Postgres service container — it proves the CODE works. This
#   workflow runs the same code against the real, persistent production
#   database on a timer — it's what makes the SYSTEM live. Different
#   purpose, different trigger, different (real) credentials — kept as a
#   separate file rather than overloading one workflow with both jobs.

name: Daily Harvest

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily
  workflow_dispatch: {}    # manual "Run workflow" button in the Actions tab

concurrency:
  group: daily-harvest
  cancel-in-progress: false   # never kill a run that's mid-write to the live DB

permissions:
  contents: read

env:
  TYPST_VERSION: "0.15.1"   # pinned to the version verified in Phase 3/6 — see docs/03, docs/07
  LLM_PROVIDER: "groq"

jobs:
  harvest:
    name: Scrape, score, notify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install typst
        run: |
          curl -sL -o /tmp/typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo mv "/tmp/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version

      - run: pip install -e .

      - name: Scrape RemoteOK and load new postings
        run: python scripts/run_ingestion.py --limit 100

      - name: Score every unscored posting
        if: always()
        run: python scripts/score_unscored_jobs.py --limit 20

      # Stopgap until PR #11 (real object storage — Supabase Storage / R2)
      # lands: this runner's disk is destroyed the moment the job ends, so
      # without this, every PDF score_unscored_jobs.py just generated would
      # be silently thrown away. A build artifact at least preserves them,
      # downloadable from the run's summary page, until PR #11 gives
      # resume_pdf_path a real, persistent URL instead of a runner-local path.
      - name: Upload generated resume PDFs (stopgap until PR #11)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs-${{ github.run_id }}
          path: output/resumes/
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on high-scoring matches
        if: always()
        run: python scripts/notify.py --threshold 85
